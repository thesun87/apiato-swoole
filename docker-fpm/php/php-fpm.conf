[www]
user = www-data
group = www-data

; TCP socket — Nginx connects via Docker network to service name "app"
listen = 0.0.0.0:9000

; Dynamic: auto scale from 4 to 20 processes
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Logging
access.log = /var/log/php-fpm/access.log
php_admin_value[error_log] = /var/log/php-fpm/error.log
php_admin_flag[log_errors] = on

; Pass Docker ENV vars into PHP processes
clear_env = no
